# Render Blueprint for the WCG auction.
services:
  - type: web
    name: wcg-auction
    runtime: node
    plan: starter               # always on; required for a persistent disk
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data        # users + auction state live here and survive restarts/deploys
      - key: OWNER_EMAIL
        value: karthik.asvsrk@gmail.com
      - key: SESSION_SECRET
        generateValue: true     # signs login cookies
      - key: HOST_PIN
        sync: false             # optional emergency host PIN (works on /login > Emergency PIN)
      - key: RESEND_API_KEY
        sync: false             # emails the "create your password" links (see README)
      - key: MAIL_FROM
        sync: false             # e.g. WCG Auction <auction@yourdomain.com>
      - key: GOOGLE_CLIENT_ID
        sync: false             # enables "Continue with Google" (see README)
    disk:
      name: auction-data
      mountPath: /var/data
      sizeGB: 1
