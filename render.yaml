# Render Blueprint for the WCG auction.
services:
  - type: web
    name: wcg-auction
    runtime: node
    plan: starter               # always on; required for a persistent disk
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: HOST_PIN
        sync: false             # set the auctioneer PIN in the Render dashboard
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data        # auction state is saved here and survives restarts/deploys
    disk:
      name: auction-data
      mountPath: /var/data
      sizeGB: 1
