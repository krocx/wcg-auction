<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WCG Mega Draft Auction — Live</title>
<link rel="icon" href="/img/jhakkas.png">
<link rel="stylesheet" href="/style.css">
<style>
.wrap{max-width:1700px;margin:0 auto;padding:18px 22px 40px}
.stage{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-bottom:18px}
.block{min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% 0%,rgba(247,200,91,.18),transparent 55%),linear-gradient(160deg,var(--card2),var(--card))}
.block::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg at 50% -20%,transparent 0 40%,rgba(255,235,170,.10) 46%,transparent 52% 100%);pointer-events:none;animation:sweep 6s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.eyebrow{font-family:var(--serif);letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);font-size:14px;font-weight:800}
.pname{font-family:var(--serif);font-weight:800;font-size:clamp(44px,7.4vw,118px);line-height:1;margin:14px 0 18px;text-shadow:0 6px 40px rgba(247,200,91,.35)}
.catmedal{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:44px;color:#071030;background:radial-gradient(circle at 35% 30%,#fff,var(--cc) 45%,color-mix(in srgb,var(--cc) 60%,#000));box-shadow:0 0 0 5px rgba(255,255,255,.12),0 0 50px color-mix(in srgb,var(--cc) 70%,transparent);margin-bottom:6px}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.base{margin-top:18px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:800}
.base b{display:block;font-family:var(--serif);font-size:clamp(28px,3.4vw,46px);color:var(--gold2);letter-spacing:.02em}
.bidcard{display:flex;flex-direction:column;gap:12px}
.bignum{font-family:var(--serif);font-weight:800;font-size:clamp(54px,7vw,110px);line-height:1;text-align:center;margin:6px 0}
.bignum.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(.7);opacity:.3}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.leader{display:flex;align-items:center;gap:14px;justify-content:center;min-height:70px}
.leader .nm{font-family:var(--serif);font-size:clamp(20px,2.4vw,32px);font-weight:800}
.leader small{display:block;color:var(--muted);font-weight:700}
.going{text-align:center;font-family:var(--serif);font-weight:800;letter-spacing:.2em;font-size:clamp(20px,2.6vw,34px);padding:8px;border-radius:14px;color:#fff;background:linear-gradient(90deg,transparent,rgba(255,93,108,.55),transparent);animation:pulse .7s infinite alternate}
@keyframes pulse{from{opacity:.6}to{opacity:1;text-shadow:0 0 18px #ff5d6c}}
.ladder{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.rung{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-weight:800}
.rung:first-child{background:rgba(247,200,91,.16);border:1px solid rgba(247,200,91,.5)}
.rung .amt{margin-left:auto;font-family:var(--serif)}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:min(560px,92%);margin-top:20px}
.prog .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}.prog .bar i{display:block;height:100%;background:var(--cc);transition:width .6s}
.prog div{font-size:12px;font-weight:800;color:var(--muted);text-align:left}
.teams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.team{padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .3s,box-shadow .3s,opacity .3s;border-top:3px solid var(--tc)}
.team.lead{transform:translateY(-6px) scale(1.02);box-shadow:0 0 0 2px var(--gold),0 0 50px rgba(247,200,91,.5);z-index:2}
.team.dim{opacity:.5}
.team.mine{outline:2px dashed var(--gold2);outline-offset:3px}
.thead{display:flex;gap:12px;align-items:center}
.tname{font-family:var(--serif);font-weight:800;font-size:17px;line-height:1.1}
.tcap{font-size:12px;color:var(--muted);font-weight:700}
.purse{font-family:var(--serif);font-size:clamp(26px,2.6vw,38px);font-weight:800;line-height:1}
.purse small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:4px}
.maxbid{font-size:13px;font-weight:800;color:#b8ffe0}.maxbid.no{color:#ffb4bc;font-weight:700;font-size:12px}
.need{font-size:12px;font-weight:800;color:var(--gold2)}
/* overlay */
#overlay{position:fixed;inset:0;z-index:60;display:none;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(20,50,130,.92),rgba(3,6,20,.97));cursor:pointer}
#overlay.show{display:grid;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
.ov{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px}
.ov .big{font-family:var(--serif);font-weight:800;font-size:clamp(70px,16vw,220px);line-height:.95;animation:slam .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes slam{from{transform:scale(3);opacity:0}to{transform:scale(1);opacity:1}}
.ov .badge{animation:pop .9s cubic-bezier(.2,1.5,.4,1) .15s both;filter:drop-shadow(0 0 40px var(--tc,#fff))}
@keyframes pop{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
.ov .who{font-family:var(--serif);font-size:clamp(28px,5vw,64px);font-weight:800}
.ov .sub{font-size:clamp(18px,2.6vw,34px);font-weight:800;color:var(--gold2)}
.ov.unsold .big{color:var(--red);transform:rotate(-6deg);border:10px solid var(--red);padding:0 .25em;border-radius:20px;font-size:clamp(60px,12vw,170px)}
.ov.draw .big{font-size:clamp(54px,11vw,160px)}
.complete{padding:40px 10px}
@media (max-width:1250px){.teams{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.stage{grid-template-columns:1fr}.wrap{padding:12px}}
@media (max-width:640px){.teams{grid-template-columns:1fr 1fr}.block{min-height:300px}.team{padding:12px}}
</style></head>
<body>
<div class="page">
 <header class="topbar">
  <a class="brand" href="/"><div><div class="mark gold-text">WCG</div></div><div><b class="serif" style="letter-spacing:.12em">MEGA DRAFT AUCTION</b><small>Weekend Cricket Group · Champions League</small></div></a>
  <span class="pill gold" id="roundPill">Round 1</span><span class="pill" id="soldPill">0 / 32 sold</span>
  <div class="spacer"></div>
  <div class="nav noprint">
   <select id="myTeam" style="width:auto;padding:7px 10px;border-radius:999px" title="Highlight your team"><option value="">My team…</option></select>
   <button class="navlink" id="soundBtn">🔇 Sound off</button>
   <button class="navlink" id="fsBtn">⛶</button>
   <a class="navlink on" href="/live">Live</a><a class="navlink" href="/squads">Squads</a>
   <span class="dot" id="conn" title="connection"></span>
  </div>
 </header>
 <div class="wrap">
  <div class="stage">
   <section class="card block" id="block"></section>
   <section class="card bidcard" id="bidcard"></section>
  </div>
  <section class="teams" id="teams"></section>
 </div>
</div>
<div id="overlay"></div><canvas id="confetti"></canvas>
<script src="/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const { esc, money, badge } = WCG;
let ST = null, lastSeq = null, lastAmt = null, overlayTimer = null, stopConfetti = null;
const TEAMCOL = {};

function render(st) {
  ST = st; st.teams.forEach(t => TEAMCOL[t.id] = t.color);
  $('roundPill').textContent = st.complete ? 'Complete' : (st.round === 2 ? 'Round 2 · Unsold return' : 'Round 1');
  $('soldPill').textContent = `${st.counts.sold} / ${st.counts.total} sold`;
  const mt = $('myTeam');
  if (mt.options.length === 1) { st.teams.forEach(t => mt.add(new Option(t.name + ' (' + t.captain + ')', t.id))); mt.value = localStorage.getItem('wcg-my') || ''; }
  renderStage(st); renderTeams(st); handleEvents(st);
}

function renderStage(st) {
  const cur = st.current, b = $('block'), c = $('bidcard');
  if (cur) {
    const p = cur.player, last = cur.bids[cur.bids.length - 1], lead = last && st.teams.find(t => t.id === last.team);
    b.innerHTML = `<div class="eyebrow">${st.round === 2 ? 'Round 2 · Unsold round' : 'On the block'}</div>
      <div class="catmedal cat${p.cat}" style="margin-top:14px">${p.cat}</div>
      <div class="eyebrow" style="color:var(--muted);font-size:12px">Category ${p.cat}</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="chips"><span class="pill">Availability ${WCG.pct(p.avail)}</span><span class="pill gold">Base ${money(p.base)}</span></div>`;
    const amt = last ? last.amount : p.base;
    const rungs = cur.bids.slice(-5).reverse().map(x => { const t = st.teams.find(t => t.id === x.team); return `<div class="rung">${badge(t, 30)}<span>${esc(t.name)}</span><span class="amt">${money(x.amount)}</span></div>`; }).join('');
    c.innerHTML = `<h2>${last ? 'Current bid' : 'Opening price'}</h2>
      <div class="bignum gold-text ${amt !== lastAmt ? 'bump' : ''}">${money(amt)}</div>
      <div class="leader">${lead ? `${badge(lead, 64)}<div><div class="nm">${esc(lead.name)}</div><small>Captain ${esc(lead.captain)}</small></div>` : `<span class="muted" style="font-weight:800;font-size:18px">Waiting for the first bid…</span>`}</div>
      ${cur.call ? `<div class="going">${cur.call === 1 ? 'GOING ONCE…' : 'GOING TWICE…'}</div>` : ''}
      <div class="ladder">${rungs}</div>`;
    lastAmt = amt;
  } else if (st.complete) {
    b.innerHTML = `<div class="complete"><div class="eyebrow">The league is complete</div><div class="pname gold-text">Auction Done!</div><div class="sub" style="font-size:20px;font-weight:800">All ${st.counts.total} players have a team.</div><p><a class="btn gold" href="/squads" style="text-decoration:none;display:inline-block">See the squads →</a></p></div>`;
    c.innerHTML = `<h2>Final</h2>` + st.teams.slice().sort((a, b) => b.spent - a.spent).map(t => `<div class="rung">${badge(t, 30)}<span>${esc(t.name)}</span><span class="amt">${money(t.spent)}</span></div>`).join('');
    lastAmt = null;
  } else {
    const per = [1, 2, 3, 4].map(k => { const all = st.players.filter(p => p.cat === k), sold = all.filter(p => p.status === 'sold').length; return `<div class="cat${k}">Category ${k} · ${sold}/${all.length}<div class="bar"><i style="width:${sold / all.length * 100}%"></i></div></div>`; }).join('');
    b.innerHTML = `<div class="eyebrow">${st.started ? 'Next player coming up' : 'Welcome to the'}</div><div class="pname gold-text" style="font-size:clamp(36px,5.5vw,84px)">${st.started ? 'Stand by…' : 'Mega Draft Auction'}</div><div class="muted" style="font-weight:700;font-size:18px">${st.started ? 'The auctioneer is drawing the next name' : '5 captains · 32 players · one big night'}</div><div class="prog">${per}</div>`;
    c.innerHTML = `<h2>How it works</h2><div class="muted" style="font-weight:700;line-height:1.7;font-size:15px">
      💰 Every team has <b style="color:#fff">${money(st.config.purse)}</b> to build a squad of ${st.config.minSquad}–${st.config.maxSquad} (captain included).<br>
      🎯 Each squad needs at least one player from every category.<br>
      🔨 Open bidding in ${money(1e6)} steps (${money(2e6)} above ${money(20e6)}). Highest bid wins.<br>
      🔁 Unsold players come back in Round 2 — teams that still need players must take them.</div>`;
    lastAmt = null;
  }
}

function renderTeams(st) {
  const cur = st.current, last = cur && cur.bids[cur.bids.length - 1], mine = localStorage.getItem('wcg-my');
  $('teams').innerHTML = st.teams.map(t => {
    const lead = last && last.team === t.id, can = t.elig && t.elig.ok;
    const slots = st.config.maxSquad, pips = [];
    for (let i = 0; i < slots; i++) pips.push(`<span class="pip ${i === 0 ? 'cap' : i <= t.buys.length ? 'buy' : (i < st.config.minSquad ? 'min' : '')}" title="${i === 0 ? 'Captain' : ''}"></span>`);
    const mb = cur ? (can ? `<div class="maxbid">Can bid up to ${money(t.elig.maxBid)}</div>` : `<div class="maxbid no">Can't bid: ${esc(t.elig.reason || '')}</div>`) : '';
    return `<div class="card team ${lead ? 'lead' : ''} ${cur && !can && !lead ? 'dim' : ''} ${mine === t.id ? 'mine' : ''}" style="--tc:${t.color}">
      <div class="thead">${badge(t, 62)}<div style="min-width:0"><div class="tname">${esc(t.name)}</div><div class="tcap">Captain ${esc(t.captain)}</div></div></div>
      <div class="purse">${money(t.left)}<small>Purse left · spent ${money(t.spent)}</small></div>
      ${mb}
      <div class="pips">${pips.join('')}</div>
      <div class="catpips">${t.cats.map((n, i) => `<span class="catpip cat${i + 1} ${n ? 'have' : ''}" title="Category ${i + 1}: ${n}">${n || (i + 1)}</span>`).join('')}</div>
      ${t.need > 0 ? `<div class="need">Needs ${t.need} more</div>` : `<div class="need" style="color:#b8ffe0">Squad minimum reached ✓</div>`}
    </div>`;
  }).join('');
}

/* ---- big moments ---- */
function showOverlay(html, ms) {
  const o = $('overlay'); o.innerHTML = html; o.classList.add('show'); clearTimeout(overlayTimer);
  overlayTimer = setTimeout(hideOverlay, ms);
}
function hideOverlay() { $('overlay').classList.remove('show'); if (stopConfetti) { stopConfetti(); stopConfetti = null; $('confetti').getContext('2d').clearRect(0, 0, 9999, 9999); } }
$('overlay').onclick = hideOverlay;

function handleEvents(st) {
  const ev = st.lastEvent;
  if (!ev) { lastSeq = st.seq; return; }
  if (lastSeq === null) { lastSeq = ev.seq; return; }            // first load: don't replay history
  if (ev.seq <= lastSeq) return;
  lastSeq = ev.seq;
  if (Date.now() - ev.ts > 15000) return;
  const pl = st.players.find(p => p.id === ev.player), t = st.teams.find(t => t.id === ev.team);
  if (ev.type === 'bid') WCG.sound.bid();
  else if (ev.type === 'going') WCG.sound.going();
  else if (ev.type === 'draw') {
    WCG.sound.draw();
    showOverlay(`<div class="ov draw"><div class="eyebrow">${ev.round === 2 || st.round === 2 ? 'Round 2 · Unsold returns' : 'Category ' + pl.cat}</div><div class="big gold-text">${esc(pl.name)}</div><div class="sub">Base price ${money(pl.base)}</div></div>`, 2200);
  } else if (ev.type === 'sold' && t) {
    WCG.sound.sold();
    showOverlay(`<div class="ov" style="--tc:${t.color}"><div class="big gold-text">SOLD!</div>${badge(t, 190)}<div class="who">${esc(pl.name)}</div><div class="sub">to ${esc(t.name)} for ${money(ev.amount)}${ev.atBase ? ' (base price)' : ''}</div><div class="muted" style="font-weight:800">Captain ${esc(t.captain)} · ${money(t.left)} left</div></div>`, 7500);
    stopConfetti = WCG.confetti($('confetti'), [t.color, '#f7c85b', '#ffffff', '#52a7ff', '#ff82b8'], 6500);
  } else if (ev.type === 'unsold') {
    WCG.sound.unsold();
    showOverlay(`<div class="ov unsold"><div class="big">UNSOLD</div><div class="who" style="margin-top:20px">${esc(pl.name)}</div><div class="sub">Returns in the unsold round</div></div>`, 3500);
  } else if (ev.type === 'reset') hideOverlay();
}

/* ---- chrome ---- */
$('myTeam').onchange = e => { localStorage.setItem('wcg-my', e.target.value); if (ST) renderTeams(ST); };
const sb = $('soundBtn'); const paintSound = () => sb.textContent = WCG.sound.on ? '🔊 Sound on' : '🔇 Sound off'; paintSound();
sb.onclick = () => { WCG.sound.toggle(); paintSound(); };
$('fsBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
WCG.connect(render, ok => { const d = $('conn'); d.className = 'dot ' + (ok ? 'on' : 'off'); });
</script></body></html>
