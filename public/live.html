<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WCG Mega Draft Auction — Live</title>
<link rel="icon" href="/img/jhakkas.png">
<link rel="stylesheet" href="/style.css">
<style>
.wrap{max-width:1700px;margin:0 auto;padding:18px 22px 40px}
.stage{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-bottom:18px}
.block{min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% 0%,rgba(247,200,91,.18),transparent 55%),linear-gradient(160deg,var(--card2),var(--card))}
.block::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg at 50% -20%,transparent 0 40%,rgba(255,235,170,.10) 46%,transparent 52% 100%);pointer-events:none;animation:sweep 6s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.eyebrow{font-family:var(--serif);letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);font-size:14px;font-weight:800}
.pname{font-family:var(--serif);font-weight:800;font-size:clamp(44px,7.4vw,118px);line-height:1;margin:14px 0 18px;text-shadow:0 6px 40px rgba(247,200,91,.35)}
.catmedal{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:44px;color:#071030;background:radial-gradient(circle at 35% 30%,#fff,var(--cc) 45%,color-mix(in srgb,var(--cc) 60%,#000));box-shadow:0 0 0 5px rgba(255,255,255,.12),0 0 50px color-mix(in srgb,var(--cc) 70%,transparent);margin-bottom:6px}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.base{margin-top:18px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:800}
.base b{display:block;font-family:var(--serif);font-size:clamp(28px,3.4vw,46px);color:var(--gold2);letter-spacing:.02em}
.bidcard{display:flex;flex-direction:column;gap:12px}
.bignum{font-family:var(--serif);font-weight:800;font-size:clamp(54px,7vw,110px);line-height:1;text-align:center;margin:6px 0}
.bignum.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(.7);opacity:.3}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.leader{display:flex;align-items:center;gap:14px;justify-content:center;min-height:70px}
.leader .nm{font-family:var(--serif);font-size:clamp(20px,2.4vw,32px);font-weight:800}
.leader small{display:block;color:var(--muted);font-weight:700}
.going{text-align:center;font-family:var(--serif);font-weight:800;letter-spacing:.2em;font-size:clamp(20px,2.6vw,34px);padding:8px;border-radius:14px;color:#fff;background:linear-gradient(90deg,transparent,rgba(255,93,108,.55),transparent);animation:pulse .7s infinite alternate}
@keyframes pulse{from{opacity:.6}to{opacity:1;text-shadow:0 0 18px #ff5d6c}}
.ladder{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.rung{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-weight:800}
.rung:first-child{background:rgba(247,200,91,.16);border:1px solid rgba(247,200,91,.5)}
.rung .amt{margin-left:auto;font-family:var(--serif)}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:min(560px,92%);margin-top:20px}
.prog .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}.prog .bar i{display:block;height:100%;background:var(--cc);transition:width .6s}
.prog div{font-size:12px;font-weight:800;color:var(--muted);text-align:left}
.teams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.team{padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .3s,box-shadow .3s,opacity .3s;border-top:3px solid var(--tc)}
.team.lead{transform:translateY(-6px) scale(1.02);box-shadow:0 0 0 2px var(--gold),0 0 50px rgba(247,200,91,.5);z-index:2}
.team.dim{opacity:.5}
.team.mine{outline:2px dashed var(--gold2);outline-offset:3px}
.thead{display:flex;gap:12px;align-items:center}
.tname{font-family:var(--serif);font-weight:800;font-size:17px;line-height:1.1}
.tcap{font-size:12px;color:var(--muted);font-weight:700}
.purse{font-family:var(--serif);font-size:clamp(26px,2.6vw,38px);font-weight:800;line-height:1}
.purse small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:4px}
.maxbid{font-size:13px;font-weight:800;color:#b8ffe0}.maxbid.no{color:#ffb4bc;font-weight:700;font-size:12px}
.need{font-size:12px;font-weight:800;color:var(--gold2)}
/* leading bidder: big, in the team's colours */
.leadbanner{position:relative;margin:6px 0 12px;padding:14px 18px 16px;border-radius:22px;border:2px solid var(--tc);background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 50%,#0a1a44),color-mix(in srgb,var(--tc) 12%,#0a1a44));box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 0 44px color-mix(in srgb,var(--tc) 55%,transparent);overflow:hidden}
.leadbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.16) 48%,transparent 60%);transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes shine{to{transform:translateX(120%)}}
.leadbanner .lbe{font-family:var(--serif);font-weight:800;letter-spacing:.24em;font-size:clamp(12px,1.3vw,16px);color:#fff;opacity:.9;margin-bottom:8px}
.leadbanner .lbm{display:flex;align-items:center;gap:16px}
.leadbanner .lbn{font-family:var(--serif);font-weight:800;line-height:1.05;font-size:clamp(26px,3.4vw,50px);text-shadow:0 3px 18px rgba(0,0,0,.5)}
.leadbanner .lbc{font-weight:800;color:#fff;opacity:.85;font-size:clamp(13px,1.4vw,18px)}
.leadbanner.new{animation:leadpop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes leadpop{0%{transform:scale(.9) rotate(-1deg);filter:brightness(1.8)}100%{transform:none}}
.leadbanner.none{border:2px dashed rgba(159,180,230,.4);background:none;box-shadow:none}.leadbanner.none::after{display:none}
.team .crown{position:absolute;top:-13px;left:50%;transform:translateX(-50%);padding:3px 12px;border-radius:999px;background:var(--gold);color:#251800;font-weight:900;font-size:12px;letter-spacing:.12em;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4)}
/* audience reactions */
#reacts{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:66;display:flex;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(8,16,48,.86);border:1px solid rgba(98,140,255,.4);backdrop-filter:blur(6px)}
#reacts button{font-size:24px;line-height:1;width:44px;height:44px;border-radius:50%;border:0;background:transparent;transition:transform .12s}
#reacts button:hover{transform:scale(1.25);background:rgba(255,255,255,.08)}#reacts button:active{transform:scale(.9)}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:67;overflow:hidden}
.fl{position:absolute;bottom:60px;animation:floatup var(--d,3.2s) ease-out forwards;will-change:transform,opacity}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:1;transform:translateY(-30px) scale(1)}100%{transform:translateY(-70vh) translateX(var(--dx,0)) scale(1.15);opacity:0}}
#soundBtn.pulse{border-color:var(--gold);color:var(--gold2);animation:snd 1.6s ease-in-out infinite}
@keyframes snd{50%{box-shadow:0 0 0 6px rgba(247,200,91,.22)}}
@media(max-width:640px){#reacts{gap:2px;padding:5px 6px;max-width:96vw}#reacts button{width:38px;height:38px;font-size:21px}}
/* live stream */
.streamcard{padding:12px;margin-bottom:16px}
.streamcard .sh{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.streamcard .sh h2{margin:0}.streamcard .sh .grow{flex:1}
.streamcard .vid{position:relative;width:100%;max-width:480px;transition:max-width .2s;margin:0 auto;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.streamcard.big .vid{max-width:1100px}
.streamcard iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.streamcard .hint{color:var(--muted);font-weight:600;font-size:12.5px;text-align:center;margin-top:8px}
.block .jersey{margin-top:6px}.block .chips{margin-top:8px}
.ov .jersey{margin:6px auto 0}
/* controls row + recent sales */
.livebar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.livebar .grow{flex:1}
.livebar .lb{display:flex;align-items:center;gap:8px;margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)}
.livebar select{width:auto;border-radius:999px;padding:8px 12px}
.sale{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:6px;font-weight:800}
.sale .amt{margin-left:auto;font-family:var(--serif);color:var(--gold2)}.sale small{color:var(--muted);font-weight:700}
/* kit try-on + SOLD stage */
.kitwrap{margin-top:6px;transform-origin:50% 100%}.kitwrap.has .jersey{filter:drop-shadow(0 0 22px var(--tc)) drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.kitwrap.shake1{animation:shk 1.1s ease-in-out infinite}.kitwrap.shake2{animation:shk .5s ease-in-out infinite}
@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.kitswap{position:relative;margin:0 auto}.kitswap>.jersey{position:absolute;inset:0}
.kitnew{position:absolute;inset:0;animation:kitwipe .8s cubic-bezier(.3,.8,.3,1) .35s both}.kitnew .jersey{position:absolute;inset:0}
@keyframes kitwipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#overlay[data-team]{overflow:hidden;background:radial-gradient(ellipse at 50% 28%,color-mix(in srgb,var(--tc) 48%,#07102f) 0%,#060a22 62%,#03050f 100%)}
#overlay[data-team]::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg at 50% -10%,transparent 0 38%,rgba(255,255,255,.16) 46%,transparent 54% 100%);pointer-events:none;animation:sweep 5s ease-in-out infinite alternate}
.ov.sold{position:relative;gap:4px}#overlay{padding-bottom:70px;box-sizing:border-box}
.ov .big{font-size:clamp(48px,min(11vw,13vh),170px)!important}
.ov .welcome{display:flex;gap:12px;align-items:center;justify-content:center;font-size:clamp(17px,2.6vw,30px);font-weight:800;color:#fff}
.ov .welcome .stamp{display:inline-flex;animation:stamp .7s cubic-bezier(.2,1.6,.4,1) 1s both;filter:drop-shadow(0 0 30px var(--tc))}
@keyframes stamp{from{transform:scale(3.2) rotate(-18deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.ov .price{font-family:var(--serif);font-weight:800;font-size:clamp(44px,8vw,96px);line-height:1;margin:2px 0}
/* overlay */
#overlay{position:fixed;inset:0;z-index:60;display:none;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(20,50,130,.92),rgba(3,6,20,.97));cursor:pointer}
#overlay.show{display:grid;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
.ov{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px}
.ov .big{font-family:var(--serif);font-weight:800;font-size:clamp(70px,16vw,220px);line-height:.95;animation:slam .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes slam{from{transform:scale(3);opacity:0}to{transform:scale(1);opacity:1}}
.ov .badge{animation:pop .9s cubic-bezier(.2,1.5,.4,1) .15s both;filter:drop-shadow(0 0 40px var(--tc,#fff))}
@keyframes pop{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
.ov .who{font-family:var(--serif);font-size:clamp(28px,5vw,64px);font-weight:800}
.ov .sub{font-size:clamp(18px,2.6vw,34px);font-weight:800;color:var(--gold2)}
.ov.unsold .big{color:var(--red);transform:rotate(-6deg);border:10px solid var(--red);padding:0 .25em;border-radius:20px;font-size:clamp(60px,12vw,170px)}
.ov.draw .big{font-size:clamp(54px,11vw,160px)}
.complete{padding:40px 10px}
@media (max-width:1250px){.teams{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.stage{grid-template-columns:1fr}.wrap{padding:12px}}
@media (max-width:640px){.teams{grid-template-columns:1fr 1fr}.block{min-height:300px}.team{padding:12px}}
</style><link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="page">
 <header class="topbar">
  <a class="brand" href="/"><div><div class="mark gold-text">WCG</div></div><div><b class="serif" style="letter-spacing:.12em">MEGA DRAFT AUCTION</b><small>Weekend Cricket Group · Champions League</small></div></a>
  <span class="pill gold" id="roundPill">Round 1</span><span class="pill" id="soldPill">0 / 0 sold</span>
  <div class="spacer"></div>
  <div class="nav noprint">
   <a class="navlink on" href="/live">Live</a><a class="navlink" href="/squads">Squads</a><a class="navlink" href="/players">Players</a>
   <span class="dot" id="conn" title="connection"></span>
  </div>
 </header>
 <div class="wrap">
  <div class="livebar noprint"><label class="lb">My team <select id="myTeam" title="Highlight your team"><option value="">Choose…</option></select></label><span class="grow"></span><button class="navlink" id="soundBtn">🔇 Tap for cheers &amp; sound</button><button class="navlink" id="fsBtn" title="Fullscreen">⛶ Fullscreen</button></div>
  <section class="card streamcard" id="streamCard" style="display:none"></section>
  <div class="stage">
   <section class="card block" id="block"></section>
   <section class="card bidcard" id="bidcard"></section>
  </div>
  <section class="teams" id="teams"></section>
  <section class="card" id="recent" style="margin-top:18px"><h2>Recent sales</h2><div id="recentList" class="muted">No sales yet.</div></section>
 </div>
</div>
<div id="floaters"></div>
<div id="reacts" class="noprint" role="group" aria-label="Cheer for the auction"></div>
<div id="overlay"></div><canvas id="confetti"></canvas>
<script src="/common.js"></script><script src="/chrome.js"></script>
<script>
const $ = id => document.getElementById(id);
const { esc, money, badge } = WCG;
let ST = null, lastSeq = null, lastAmt = null, lastLead = null, lastPid = null, overlayTimer = null, stopConfetti = null;
const TEAMCOL = {};

function render(st) {
  ST = st; st.teams.forEach(t => TEAMCOL[t.id] = t.color);
  $('roundPill').textContent = st.complete ? 'Complete' : (st.round === 2 ? 'Round 2 · Unsold return' : 'Round 1');
  $('soldPill').textContent = `${st.counts.sold} / ${st.counts.total} sold`;
  const mt = $('myTeam');
  if (mt.options.length === 1) { st.teams.forEach(t => mt.add(new Option(t.name + ' (' + t.captain + ')', t.id))); mt.value = localStorage.getItem('wcg-my') || ''; }
  renderStream(st); renderStage(st); renderTeams(st); renderRecent(st); handleEvents(st);
}

function incText(c) {
  const sl = c.slabs || []; if (sl.length < 2) return ` in ${money((sl[0] || { inc: 1e6 }).inc)} steps`;
  return ' — ' + sl.map((x, i) => `${money(x.inc)} steps${x.upTo > 0 ? ' up to ' + money(x.upTo) : (i ? ' above ' + money(sl[i - 1].upTo) : '')}`).join(', ');
}
/* YouTube live stream (set by the host/owner). The iframe is only rebuilt when the link changes, so the video never reloads on each bid. */
let streamKey = '';
function renderStream(st) {
  const c = $('streamCard'), s = st.stream, key = s ? s.kind + ':' + s.id : '', hidden = localStorage.getItem('wcg-hidestream') === '1', big = localStorage.getItem('wcg-bigstream') === '1';
  if (!s) { c.style.display = 'none'; c.innerHTML = ''; streamKey = ''; return; }
  c.style.display = '';
  const full = key + (hidden ? ':h' : '') + (big ? ':b' : ''); c.classList.toggle('big', big);
  if (full === streamKey) return; streamKey = full;
  const src = s.kind === 'channel' ? `https://www.youtube-nocookie.com/embed/live_stream?channel=${encodeURIComponent(s.id)}&autoplay=1&mute=1&playsinline=1&rel=0` : `https://www.youtube-nocookie.com/embed/${encodeURIComponent(s.id)}?autoplay=1&mute=1&playsinline=1&rel=0`;
  const watch = s.kind === 'channel' ? `https://www.youtube.com/channel/${encodeURIComponent(s.id)}/live` : `https://www.youtube.com/watch?v=${encodeURIComponent(s.id)}`;
  c.innerHTML = `<div class="sh"><h2>📺 Live stream</h2><span class="pill red">● LIVE</span><span class="grow"></span><a class="btn sm" href="${watch}" target="_blank" rel="noopener" style="text-decoration:none">Open on YouTube ↗</a>${hidden ? '' : `<button class="btn sm" id="vidSize">${big ? 'Smaller' : 'Larger'}</button>`}<button class="btn sm" id="vidToggle">${hidden ? 'Show video' : 'Hide video'}</button></div>` +
    (hidden ? '' : `<div class="vid"><iframe src="${src}" title="WCG auction live stream" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="hint">Video starts muted — tap the speaker icon in the player for sound. A few seconds' delay behind the bids is normal.</div>`);
  if ($('vidSize')) $('vidSize').onclick = () => { localStorage.setItem('wcg-bigstream', big ? '0' : '1'); streamKey = ''; renderStream(ST); };
  $('vidToggle').onclick = () => { localStorage.setItem('wcg-hidestream', hidden ? '0' : '1'); streamKey = ''; renderStream(ST); };
}

function renderStage(st) {
  const cur = st.current, b = $('block'), c = $('bidcard');
  if (cur) {
    const p = cur.player, last = cur.bids[cur.bids.length - 1], lead = last && st.teams.find(t => t.id === last.team);
    if (p.id !== lastPid) { lastPid = p.id; lastLead = null; }
    const swap = lead && lead.id !== lastLead, js = Math.round(Math.min(210, Math.max(150, innerHeight * .24)));
    b.style.setProperty('--tc', lead ? lead.color : 'transparent');
    b.innerHTML = `<div class="eyebrow">${st.round === 2 ? 'Round 2 · Unsold round' : 'On the block'}</div>
      <div class="kitwrap ${lead ? 'has' : ''} ${cur.call === 1 ? 'shake1' : cur.call === 2 ? 'shake2' : ''}">${swap ? WCG.kitSwap(p, lead, js) : WCG.jersey(p, lead, js)}</div>
      <div class="eyebrow" style="color:var(--muted);font-size:12px">Category ${p.cat}</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="chips"><span class="pill">Availability ${WCG.pct(p.avail)}</span><span class="pill gold">Base ${money(p.base)}</span></div>`;
    const amt = last ? last.amount : p.base;
    const rungs = cur.bids.slice(-5).reverse().map(x => { const t = st.teams.find(t => t.id === x.team); return `<div class="rung">${badge(t, 30)}<span>${esc(t.name)}</span><span class="amt">${money(x.amount)}</span></div>`; }).join('');
    c.innerHTML = `<h2>${last ? 'Current bid' : 'Opening price'}</h2>
      <div class="bignum gold-text ${amt !== lastAmt ? 'bump' : ''}">${money(amt)}</div>
      <div class="leadbanner ${lead ? '' : 'none'} ${lead && lead.id !== lastLead ? 'new' : ''}" ${lead ? `style="--tc:${lead.color}"` : ''}>
        ${lead ? `<div class="lbe">👑 HIGHEST BIDDER</div><div class="lbm">${badge(lead, 108)}<div><div class="lbn">${esc(lead.name)}</div><div class="lbc">Captain ${esc(lead.captain)}</div></div></div>` : `<div class="muted" style="font-weight:800;font-size:18px;text-align:center;padding:14px 0">Waiting for the first bid…</div>`}
      </div>
      ${cur.call ? `<div class="going">${cur.call === 1 ? 'GOING ONCE…' : 'GOING TWICE…'}</div>` : ''}
      <div class="ladder">${rungs}</div>`;
    lastAmt = amt; lastLead = lead ? lead.id : null;
  } else if (st.complete) {
    b.innerHTML = `<div class="complete"><div class="eyebrow">The league is complete</div><div class="pname gold-text">Auction Done!</div><div class="sub" style="font-size:20px;font-weight:800">All ${st.counts.total} players have a team.</div><p><a class="btn gold" href="/squads" style="text-decoration:none;display:inline-block">See the squads →</a></p></div>`;
    c.innerHTML = `<h2>Final</h2>` + st.teams.slice().sort((a, b) => b.spent - a.spent).map(t => `<div class="rung">${badge(t, 30)}<span>${esc(t.name)}</span><span class="amt">${money(t.spent)}</span></div>`).join('');
    lastAmt = null; lastLead = null;
  } else {
    const per = [1, 2, 3, 4].map(k => { const all = st.players.filter(p => p.cat === k), sold = all.filter(p => p.status === 'sold').length; return `<div class="cat${k}">Category ${k} · ${sold}/${all.length}<div class="bar"><i style="width:${sold / all.length * 100}%"></i></div></div>`; }).join('');
    b.innerHTML = `<div class="eyebrow">${st.started ? 'Next player coming up' : 'Welcome to the'}</div><div class="pname gold-text" style="font-size:clamp(36px,5.5vw,84px)">${st.started ? 'Stand by…' : 'Mega Draft Auction'}</div><div class="muted" style="font-weight:700;font-size:18px">${st.started ? 'The auctioneer is drawing the next name' : `5 captains · ${st.counts.total} players · one big night`}</div><div class="prog">${per}</div>`;
    c.innerHTML = `<h2>How it works</h2><div class="muted" style="font-weight:700;line-height:1.7;font-size:15px">
      💰 Every team has <b style="color:#fff">${money(st.config.purse)}</b> to build a squad of ${st.config.minSquad}–${st.config.maxSquad} (captain included).<br>
      🎲 Players are drawn at random from all categories — anyone can come up next.<br>
      🔨 Open bidding${incText(st.config)}. Highest bid wins.<br>
      🔁 Unsold players come back in Round 2 — teams that still need players must take them.</div>`;
    lastAmt = null;
  }
}

function renderTeams(st) {
  const cur = st.current, last = cur && cur.bids[cur.bids.length - 1], mine = localStorage.getItem('wcg-my');
  $('teams').innerHTML = st.teams.map(t => {
    const lead = last && last.team === t.id, can = t.elig && t.elig.ok;
    const slots = st.config.maxSquad, pips = [];
    for (let i = 0; i < slots; i++) pips.push(`<span class="pip ${i === 0 ? 'cap' : i <= t.buys.length ? 'buy' : (i < st.config.minSquad ? 'min' : '')}" title="${i === 0 ? 'Captain' : ''}"></span>`);
    const mb = cur ? (can ? `<div class="maxbid">Can bid up to ${money(t.elig.maxBid)}</div>` : `<div class="maxbid no">Can't bid: ${esc(t.elig.reason || '')}</div>`) : '';
    return `<div class="card team ${lead ? 'lead' : ''} ${cur && !can && !lead ? 'dim' : ''} ${mine === t.id ? 'mine' : ''}" style="--tc:${t.color}">
      ${lead ? '<div class="crown">👑 LEADING</div>' : ''}
      <div class="thead">${badge(t, 62)}<div style="min-width:0"><div class="tname">${esc(t.name)}</div><div class="tcap">Captain ${esc(t.captain)}</div></div></div>
      <div class="purse">${money(t.left)}<small>Purse left · spent ${money(t.spent)}</small></div>
      ${mb}
      <div class="pips">${pips.join('')}</div>
      <div class="catpips">${t.cats.map((n, i) => `<span class="catpip cat${i + 1} ${n ? 'have' : ''}" title="Category ${i + 1}: ${n}">${n || (i + 1)}</span>`).join('')}</div>
      ${t.need > 0 ? `<div class="need">Needs ${t.need} more</div>` : `<div class="need" style="color:#b8ffe0">Squad minimum reached ✓</div>`}
    </div>`;
  }).join('');
}

function renderRecent(st) {
  const byId = Object.fromEntries(st.players.map(p => [p.id, p])), tm = Object.fromEntries(st.teams.map(t => [t.id, t]));
  const sold = st.log.filter(e => e.type === 'sold' && byId[e.player] && byId[e.player].status === 'sold').slice(-8).reverse();
  $('recentList').innerHTML = sold.length ? sold.map(e => { const t = tm[e.team], p = byId[e.player]; return `<div class="sale">${badge(t, 30)}<span>${esc(p.name)} <small>Cat ${p.cat}${e.atBase ? ' · at base' : ''}</small></span><span class="muted">${esc(t.name)}</span><span class="amt">${money(e.amount)}</span></div>`; }).join('') : 'No sales yet.';
}

/* ---- big moments ---- */
function showOverlay(html, ms, tc) {
  const o = $('overlay'); o.innerHTML = html; if (tc) o.dataset.team = '1'; else delete o.dataset.team; o.style.setProperty('--tc', tc || 'transparent'); o.classList.add('show'); clearTimeout(overlayTimer);
  overlayTimer = setTimeout(hideOverlay, ms);
}
const lum = h => { const n = parseInt(h.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };
const glow = t => { const j = t.jersey && t.jersey[0]; return j && lum(j) > .2 ? j : (t.jersey && t.jersey[1]) || t.color; };
function countUp(el, from, to, ms) {
  const t0 = performance.now(), step = 0.25e6; ms = ms || 1300;
  (function f(t) { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = money(k >= 1 ? to : Math.round((from + (to - from) * e) / step) * step); if (k < 1) requestAnimationFrame(f); })(t0);
}
function hideOverlay() { $('overlay').classList.remove('show'); if (stopConfetti) { stopConfetti(); stopConfetti = null; $('confetti').getContext('2d').clearRect(0, 0, 9999, 9999); } }
$('overlay').onclick = hideOverlay;

function jerseySize() { return Math.round(Math.min(250, Math.max(130, innerHeight * .26))); }
function handleEvents(st) {
  const ev = st.lastEvent;
  if (!ev) { lastSeq = st.seq; return; }
  if (lastSeq === null) { lastSeq = ev.seq; return; }            // first load: don't replay history
  if (ev.seq <= lastSeq) return;
  lastSeq = ev.seq;
  if (Date.now() - ev.ts > 15000) return;
  const pl = st.players.find(p => p.id === ev.player), t = st.teams.find(t => t.id === ev.team);
  if (ev.type === 'bid') WCG.sound.bid();
  else if (ev.type === 'going') WCG.sound.going();
  else if (ev.type === 'draw') {
    WCG.sound.draw();
    showOverlay(`<div class="ov draw"><div class="eyebrow">${ev.round === 2 || st.round === 2 ? 'Round 2 · Unsold returns' : 'Category ' + pl.cat}</div>${WCG.jersey(pl, null, jerseySize())}<div class="big gold-text">${esc(pl.name)}</div><div class="sub">Base price ${money(pl.base)}</div></div>`, 2600);
  } else if (ev.type === 'sold' && t) {
    WCG.sound.celebrate();
    showOverlay(`<div class="ov sold" style="--tc:${t.color}"><div class="big gold-text">SOLD!</div>${WCG.kitSwap(pl, t, jerseySize())}<div class="who">${esc(pl.name)}</div><div class="welcome"><span class="stamp">${badge(t, 56)}</span><span>Welcome to ${esc(t.name)}</span></div><div class="price gold-text" id="ovPrice">${money(ev.atBase ? ev.amount : (pl.base || ev.amount))}</div>${ev.atBase ? '<div class="muted" style="font-weight:800">Signed at base price</div>' : ''}<div class="muted" style="font-weight:800">Captain ${esc(t.captain)} · ${money(t.left)} left</div><button class="btn gold sm" id="ovShare" style="margin-top:10px">📤 Share signing card</button></div>`, 12000, glow(t));
    countUp($('ovPrice'), pl.base || ev.amount, ev.amount);
    $('ovShare').onclick = e => { e.stopPropagation(); clearTimeout(overlayTimer); const bt = e.currentTarget; bt.disabled = true; bt.textContent = 'Preparing…'; WCG.shareCard(pl, t, ev.amount, t.left).catch(() => {}).then(() => { bt.disabled = false; bt.textContent = '📤 Share signing card'; overlayTimer = setTimeout(hideOverlay, 8000); }); };
    stopConfetti = WCG.confetti($('confetti'), [t.color, '#f7c85b', '#ffffff', '#52a7ff', '#ff82b8'], 6500);
  } else if (ev.type === 'unsold') {
    WCG.sound.unsold();
    showOverlay(`<div class="ov unsold"><div class="big unsold">UNSOLD</div><div class="who" style="margin-top:20px">${esc(pl.name)}</div><div class="sub">Returns in the unsold round</div></div>`, 3500);
  } else if (ev.type === 'reset') hideOverlay();
}

/* ---- audience reactions: tap an emoji, everyone watching sees it float up ---- */
document.getElementById('reacts').innerHTML = ['👏', '🎉', '🔥', '😮', '😂', '❤️', '🏏'].map(e => `<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
let lastReact = 0; const claps = []; let lastApplause = 0;
document.getElementById('reacts').onclick = e => {
  const b = e.target.closest('button'); if (!b || Date.now() - lastReact < 250) return; lastReact = Date.now();
  fetch('/api/react', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ e: b.dataset.e }) }).catch(() => { });
};
WCG.onReact = ({ e }) => {
  const box = $('floaters'), n = document.createElement('span'); n.className = 'fl'; n.textContent = e;
  n.style.cssText = `left:${8 + Math.random() * 84}%;font-size:${30 + Math.random() * 30}px;--d:${2.6 + Math.random() * 1.6}s;--dx:${(Math.random() - .5) * 120}px`;
  box.appendChild(n); setTimeout(() => n.remove(), 4500); if (box.children.length > 60) box.firstChild.remove();
  if (e === '👏') { const now = Date.now(); claps.push(now); while (claps.length && now - claps[0] > 3000) claps.shift(); if (claps.length >= 5 && now - lastApplause > 9000) { lastApplause = now; WCG.sound.applause(2.8, 70); } }
};

/* ---- chrome ---- */
$('myTeam').onchange = e => { localStorage.setItem('wcg-my', e.target.value); if (ST) renderTeams(ST); };
const sb = $('soundBtn'); const paintSound = () => { sb.textContent = WCG.sound.on ? '🔊 Cheers & sound on' : '🔇 Tap for cheers & sound'; sb.classList.toggle('pulse', !WCG.sound.on); }; paintSound();
sb.onclick = () => { WCG.sound.toggle(); paintSound(); };
$('fsBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
WCG.connect(render, ok => { const d = $('conn'); d.className = 'dot ' + (ok ? 'on' : 'off'); });
</script></body></html>
